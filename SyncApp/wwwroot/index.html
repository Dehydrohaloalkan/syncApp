<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SyncApp</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">SyncApp <small>зашифрованная GitHub-синхронизация</small></div>
      <button id="new-project" class="primary">Новый проект</button>
      <nav id="projects" aria-label="Проекты"></nav>
      <p class="sidebar-note">Приложение работает локально. В junk передаются только подписанные зашифрованные пакеты.</p>
    </aside>
    <main id="main" tabindex="-1">
      <div class="empty">Выберите проект слева или создайте новый.</div>
    </main>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
</body>
</html>
